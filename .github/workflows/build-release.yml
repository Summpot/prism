name: build-release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (dev or release)"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - release

permissions:
  contents: read

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests

      - name: cargo test
        run: cargo test --workspace --no-default-features

  rust-binaries:
    name: rust binaries (${{ matrix.os }}/${{ matrix.arch }} / ${{ matrix.target }})
    needs: test-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            desktop: true
            upx: true
            artifact_compression: 0
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
            desktop: false
            upx: true
            artifact_compression: 0
          # musl stays headless
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            container: ghcr.io/blackdex/rust-musl:x86_64-musl-stable
            desktop: false
            upx: true
            artifact_compression: 0
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            container: ghcr.io/blackdex/rust-musl:aarch64-musl-stable
            desktop: false
            upx: true
            artifact_compression: 0
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            rid: osx-x64
            desktop: true
            upx: false
            artifact_compression: 6
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
            desktop: true
            upx: false
            artifact_compression: 6
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            desktop: true
            upx: true
            artifact_compression: 0
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-binaries-${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: matrix.desktop && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libice-dev \
            libsm-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            patchelf \
            xdg-utils \
            file \
            squashfs-tools \
            rpm \
            dpkg
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Setup .NET
        if: matrix.desktop
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build (release) (headless)
        if: ${{ !matrix.desktop }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p prism_native --bin prism --no-default-features --target "${{ matrix.target }}"

      - name: Build (release) (Avalonia desktop binary)
        if: matrix.desktop
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.${GITHUB_SHA:0:7}"
          fi
          CLEAN_VERSION="${VERSION%%-*}"
          dotnet publish src/Prism.csproj -c Release -r "${{ matrix.rid }}" -p:PublishAot=true -p:Version="${CLEAN_VERSION}" -p:InformationalVersion="${VERSION}" -o desktop_publish

      - name: Compress binary with UPX
        if: matrix.upx && !matrix.desktop
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: |
            target/${{ matrix.target }}/release/prism${{ matrix.os == 'windows' && '.exe' || '' }}
          args: --best

      - name: Package desktop (windows)
        if: matrix.desktop && runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.1.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }
          $cleanVersion = if ($version -match '^\d+(\.\d+){1,3}') { $matches[0] } else { "0.1.0" }

          $outdir = "artifacts"
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null

          $target = "${{ matrix.target }}"
          $binDir = (Resolve-Path "desktop_publish").Path
          $binPath = (Join-Path $binDir "prism.exe")
          $iconPath = (Resolve-Path "crates/prism/icons/icon.ico").Path

          Copy-Item -Force -Path $binPath -Destination (Join-Path $outdir "prism_${version}_${target}.exe")

          # Install packaging tools (NSIS) via Chocolatey
          choco install nsis --no-progress -y
          $env:PATH += ";C:\Program Files (x86)\NSIS"

          # 1. NSIS Installer (.exe)
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            } else {
              $makensis = "makensis.exe"
            }
          }
          $nsisOut = [System.IO.Path]::GetFullPath((Join-Path $outdir "Prism_${version}_x64-setup.exe"))
          $installerNsi = (Resolve-Path "packaging/windows/installer.nsi").Path
          & $makensis /DVERSION="$version" /DARCH="x64" /DOUTFILE="$nsisOut" /DBIN_PATH="$binPath" /DBIN_DIR="$binDir" /DICON_PATH="$iconPath" "$installerNsi"

          # 2. WiX Toolset MSI (.msi)
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          $light = (Get-Command light.exe -ErrorAction SilentlyContinue).Source
          if ($candle -and $light) {
            $msiOut = [System.IO.Path]::GetFullPath((Join-Path $outdir "Prism_${version}_x64_en-US.msi"))
            $mainWxs = (Resolve-Path "packaging/windows/main.wxs").Path
            & $candle -dVersion="$cleanVersion" -dBinPath="$binPath" -dIconPath="$iconPath" "$mainWxs" -out main.wixobj
            & $light -ext WixUIExtension -sval main.wixobj -out "$msiOut"
            Remove-Item -Force main.wixobj, main.wixpdb -ErrorAction SilentlyContinue
          } else {
            Write-Warning "WiX Toolset not found; skipping MSI build"
          }

          # 3. Optional standalone zip archive
          $zipOut = Join-Path $outdir "prism_${version}_x64.zip"
          $filesToZip = @($binPath)
          $angleDll = Join-Path $binDir "av_libglesv2.dll"
          if (Test-Path $angleDll) {
            $filesToZip += $angleDll
          }
          Compress-Archive -Path $filesToZip -DestinationPath $zipOut -CompressionLevel NoCompression -Force

      - name: Package desktop (macos)
        if: matrix.desktop && runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.${GITHUB_SHA:0:7}"
          fi

          OUTDIR="artifacts"
          mkdir -p "${OUTDIR}"

          TARGET="${{ matrix.target }}"
          BIN_PATH="desktop_publish/prism"
          cp -v "${BIN_PATH}" "${OUTDIR}/prism_${VERSION}_${TARGET}"

          DMG_ARCH="x64"
          if [[ "${TARGET}" == "aarch64-apple-darwin" ]]; then
            DMG_ARCH="aarch64"
          fi

          # 1. Assemble Prism.app
          rm -rf Prism.app
          mkdir -p Prism.app/Contents/MacOS
          mkdir -p Prism.app/Contents/Resources
          cp -v "${BIN_PATH}" Prism.app/Contents/MacOS/prism
          chmod +x Prism.app/Contents/MacOS/prism

          # Generate icon.icns from icon.png
          mkdir -p Prism.iconset
          sips -z 16 16     crates/prism/icons/icon.png --out Prism.iconset/icon_16x16.png
          sips -z 32 32     crates/prism/icons/icon.png --out Prism.iconset/icon_16x16@2x.png
          sips -z 32 32     crates/prism/icons/icon.png --out Prism.iconset/icon_32x32.png
          sips -z 64 64     crates/prism/icons/icon.png --out Prism.iconset/icon_32x32@2x.png
          sips -z 128 128   crates/prism/icons/icon.png --out Prism.iconset/icon_128x128.png
          sips -z 256 256   crates/prism/icons/icon.png --out Prism.iconset/icon_128x128@2x.png
          sips -z 256 256   crates/prism/icons/icon.png --out Prism.iconset/icon_256x256.png
          sips -z 512 512   crates/prism/icons/icon.png --out Prism.iconset/icon_256x256@2x.png
          sips -z 512 512   crates/prism/icons/icon.png --out Prism.iconset/icon_512x512.png
          sips -z 1024 1024 crates/prism/icons/icon.png --out Prism.iconset/icon_512x512@2x.png
          iconutil -c icns Prism.iconset -o Prism.app/Contents/Resources/icon.icns
          rm -rf Prism.iconset

          sed "s/{{VERSION}}/${VERSION}/g" packaging/macos/Info.plist > Prism.app/Contents/Info.plist

          # Ad-hoc code sign
          codesign --force --deep -s - Prism.app

          # 2. Package DMG
          hdiutil create -volname "Prism" -srcfolder Prism.app -ov -format UDZO "${OUTDIR}/Prism_${VERSION}_${DMG_ARCH}.dmg"

          # 3. Package App tarball for updater
          tar -czf "${OUTDIR}/Prism_${VERSION}_${DMG_ARCH}.app.tar.gz" Prism.app


      - name: Package desktop (linux)
        if: matrix.desktop && runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.${GITHUB_SHA:0:7}"
          fi
          CLEAN_VERSION="${VERSION%%-*}"

          OUTDIR="artifacts"
          mkdir -p "${OUTDIR}"

          TARGET="${{ matrix.target }}"
          BIN_PATH="desktop_publish/prism"
          cp -v "${BIN_PATH}" "${OUTDIR}/prism_${VERSION}_${TARGET}"

          ARCH="amd64"
          RPM_ARCH="x86_64"
          APPIMAGE_ARCH="x86_64"
          if [[ "${TARGET}" == "aarch64-unknown-linux-gnu" ]]; then
            ARCH="arm64"
            RPM_ARCH="aarch64"
            APPIMAGE_ARCH="aarch64"
          fi

          # 1. Debian Package (.deb)
          DEBDIR="deb_package"
          rm -rf "${DEBDIR}"
          mkdir -p "${DEBDIR}/DEBIAN"
          mkdir -p "${DEBDIR}/usr/bin"
          mkdir -p "${DEBDIR}/usr/share/applications"
          mkdir -p "${DEBDIR}/usr/share/icons/hicolor/512x512/apps"

          cp "${BIN_PATH}" "${DEBDIR}/usr/bin/prism"
          chmod 755 "${DEBDIR}/usr/bin/prism"
          cp "packaging/linux/prism.desktop" "${DEBDIR}/usr/share/applications/prism.desktop"
          cp "crates/prism/icons/icon.png" "${DEBDIR}/usr/share/icons/hicolor/512x512/apps/prism.png"

          printf "Package: prism\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: %s\nMaintainer: Prism <support@prism.com>\nDescription: Prism lightweight client\n" "${CLEAN_VERSION}" "${ARCH}" > "${DEBDIR}/DEBIAN/control"
          dpkg-deb --build "${DEBDIR}" "${OUTDIR}/prism_${VERSION}_${ARCH}.deb"

          # 2. RPM Package (.rpm)
          RPM_ROOT="rpm_root"
          rm -rf "${RPM_ROOT}"
          mkdir -p "${RPM_ROOT}/BUILD" "${RPM_ROOT}/RPMS" "${RPM_ROOT}/SOURCES" "${RPM_ROOT}/SPECS" "${RPM_ROOT}/SRPMS"
          mkdir -p "${RPM_ROOT}/BUILDROOT/prism-${CLEAN_VERSION}-1.${RPM_ARCH}/usr/bin"
          mkdir -p "${RPM_ROOT}/BUILDROOT/prism-${CLEAN_VERSION}-1.${RPM_ARCH}/usr/share/applications"
          mkdir -p "${RPM_ROOT}/BUILDROOT/prism-${CLEAN_VERSION}-1.${RPM_ARCH}/usr/share/icons/hicolor/512x512/apps"

          cp "${BIN_PATH}" "${RPM_ROOT}/BUILDROOT/prism-${CLEAN_VERSION}-1.${RPM_ARCH}/usr/bin/prism"
          cp "packaging/linux/prism.desktop" "${RPM_ROOT}/BUILDROOT/prism-${CLEAN_VERSION}-1.${RPM_ARCH}/usr/share/applications/prism.desktop"
          cp "crates/prism/icons/icon.png" "${RPM_ROOT}/BUILDROOT/prism-${CLEAN_VERSION}-1.${RPM_ARCH}/usr/share/icons/hicolor/512x512/apps/prism.png"

          printf "Name: prism\nVersion: %s\nRelease: 1\nSummary: Prism lightweight client\nLicense: MIT\n\n%%description\nPrism lightweight client\n\n%%files\n/usr/bin/prism\n/usr/share/applications/prism.desktop\n/usr/share/icons/hicolor/512x512/apps/prism.png\n" "${CLEAN_VERSION}" > "${RPM_ROOT}/SPECS/prism.spec"
          rpmbuild -bb --target "${RPM_ARCH}" --define "_topdir $(pwd)/${RPM_ROOT}" "${RPM_ROOT}/SPECS/prism.spec" || true
          if ls "${RPM_ROOT}/RPMS/${RPM_ARCH}/"*.rpm 1> /dev/null 2>&1; then
            cp "${RPM_ROOT}/RPMS/${RPM_ARCH}/"*.rpm "${OUTDIR}/prism_${VERSION}_${ARCH}.rpm"
          fi

          # 3. AppImage
          APPDIR="AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/512x512/apps"
          cp "${BIN_PATH}" "${APPDIR}/usr/bin/prism"
          chmod 755 "${APPDIR}/usr/bin/prism"
          cp "packaging/linux/prism.desktop" "${APPDIR}/prism.desktop"
          cp "crates/prism/icons/icon.png" "${APPDIR}/prism.png"
          cp "crates/prism/icons/icon.png" "${APPDIR}/usr/share/icons/hicolor/512x512/apps/prism.png"

          {
            echo '#!/bin/sh'
            echo 'SELF=$(readlink -f "$0")'
            echo 'HERE=${SELF%/*}'
            echo 'export PATH="${HERE}/usr/bin:${PATH}"'
            echo 'exec "${HERE}/usr/bin/prism" "$@"'
          } > "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGE_ARCH}.AppImage"
          curl -sSL -o appimagetool "${APPIMAGETOOL_URL}"
          chmod +x appimagetool
          ARCH="${APPIMAGE_ARCH}" ./appimagetool --appimage-extract-and-run "${APPDIR}" "${OUTDIR}/Prism_${VERSION}_${ARCH}.AppImage" || true
          rm -f appimagetool

          # Package AppImage tarball for updater
          if [[ -f "${OUTDIR}/Prism_${VERSION}_${ARCH}.AppImage" ]]; then
            tar -czf "${OUTDIR}/Prism_${VERSION}_${ARCH}.AppImage.tar.gz" -C "${OUTDIR}" "Prism_${VERSION}_${ARCH}.AppImage"
          fi


      - name: Prepare artifacts (headless unix)
        if: ${{ !matrix.desktop && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi

          OUTDIR="artifacts"
          mkdir -p "${OUTDIR}"

          TARGET="${{ matrix.target }}"
          if [[ -f "target/${TARGET}/release/prism" ]]; then
            cp -v "target/${TARGET}/release/prism" "${OUTDIR}/prism_${VERSION}_${TARGET}"
          fi

      - name: Prepare artifacts (headless windows)
        if: ${{ !matrix.desktop && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }

          $outdir = "artifacts"
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null

          $target = "${{ matrix.target }}"
          if (Test-Path "target/$target/release/prism.exe") {
            Copy-Item -Force -Path "target/$target/release/prism.exe" -Destination (Join-Path $outdir "prism_${version}_${target}.exe")
          }

      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: prism-artifacts-${{ matrix.target }}
          path: artifacts/*
          compression-level: ${{ matrix.artifact_compression }}

  release:
    runs-on: ubuntu-latest
    needs: rust-binaries
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: prism-artifacts-*
          path: dist
          merge-multiple: true

      - name: Determine channel and release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            CHANNEL="release"
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_NAME="Prism ${GITHUB_REF_NAME}"
            PRERELEASE="false"
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event.inputs.channel }}" == "release" ]]; then
            CHANNEL="release"
            TAG_NAME="release"
            RELEASE_NAME="Prism Release"
            PRERELEASE="false"
            VERSION="0.1.0"
          else
            CHANNEL="dev"
            TAG_NAME="dev"
            RELEASE_NAME="Prism Development Build"
            PRERELEASE="true"
            VERSION="0.1.0-dev.${GITHUB_SHA:0:7}"
          fi

          echo "channel=${CHANNEL}" >> $GITHUB_ENV
          echo "tag_name=${TAG_NAME}" >> $GITHUB_ENV
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "prerelease=${PRERELEASE}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Update dev git tag
        if: env.channel == 'dev'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f dev "${GITHUB_SHA}"
          git push -f origin dev || true

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Sign updater artifacts with Minisign
        env:
          KEY_CONTENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_CONTENT" ]; then
            if echo "$KEY_CONTENT" | grep -q "untrusted comment:"; then
              echo "$KEY_CONTENT" > /tmp/minisign.key
            else
              echo "$KEY_CONTENT" | base64 -d > /tmp/minisign.key
            fi

            for f in dist/*.exe dist/*.msi dist/*.zip dist/*.AppImage dist/*.tar.gz dist/*.dmg; do
              if [ -f "$f" ]; then
                echo "Signing $f..."
                printf '%s\n' "${KEY_PASSWORD:-}" | minisign -S -s /tmp/minisign.key -m "$f" -x "$f.sig"
                base64 -w 0 "$f.sig" > "$f.sig.b64" && mv "$f.sig.b64" "$f.sig"
              fi
            done
            rm -f /tmp/minisign.key
          fi

      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distDir = "dist";
          const tag = process.env.tag_name;
          const repo = process.env.GITHUB_REPOSITORY;
          const version = process.env.version || "0.1.0";

          const files = fs.readdirSync(distDir);
          console.log("Files in dist:", files);

          const manifest = {
            version: version,
            notes: `Prism ${process.env.channel} build (${process.env.GITHUB_SHA ? process.env.GITHUB_SHA.slice(0, 7) : ""})`,
            pub_date: new Date().toISOString(),
            platforms: {}
          };

          function findSignedAsset(pattern) {
            const candidates = files.filter(f => pattern.test(f) && !f.endsWith(".sig"));
            for (const asset of candidates) {
              if (files.includes(asset + ".sig")) {
                const sigContent = fs.readFileSync(path.join(distDir, asset + ".sig"), "utf8").trim();
                if (sigContent) {
                  return { asset, signature: sigContent };
                }
              }
            }
            return null;
          }

          function registerPlatform(keys, pattern) {
            const match = findSignedAsset(pattern);
            if (!match) return false;
            const entry = {
              signature: match.signature,
              url: `https://github.com/${repo}/releases/download/${tag}/${match.asset}`
            };
            for (const key of (Array.isArray(keys) ? keys : [keys])) {
              manifest.platforms[key] = entry;
              console.log(`Added platform ${key}: asset=${match.asset}`);
            }
            return true;
          }

          // Windows x86_64: prioritize direct NSIS setup installer (.exe)
          registerPlatform(["windows-x86_64", "windows-x86_64-nsis"], /(x64|x86_64).*-setup\.exe$/i) ||
          registerPlatform(["windows-x86_64", "windows-x86_64-nsis"], /(setup\.exe|\.exe)$/i) ||
          registerPlatform(["windows-x86_64", "windows-x86_64-nsis"], /(x64|x86_64).*\.zip$/i);

          // Windows x86_64 MSI
          registerPlatform("windows-x86_64-msi", /(x64|x86_64).*\.msi$/i);

          // Linux x86_64 (prefer AppImage tar.gz for Tauri updater compatibility, then AppImage)
          registerPlatform(["linux-x86_64", "linux-x86_64-appimage"], /(amd64|x86_64).*AppImage\.tar\.gz$/i) ||
          registerPlatform(["linux-x86_64", "linux-x86_64-appimage"], /(amd64|x86_64).*AppImage$/i);

          // Linux aarch64 (prefer AppImage tar.gz for Tauri updater compatibility, then AppImage)
          registerPlatform(["linux-aarch64", "linux-aarch64-appimage"], /(arm64|aarch64).*AppImage\.tar\.gz$/i) ||
          registerPlatform(["linux-aarch64", "linux-aarch64-appimage"], /(arm64|aarch64).*AppImage$/i);

          // Darwin x86_64
          registerPlatform("darwin-x86_64", /(x64|x86_64).*app\.tar\.gz$/i) ||
          registerPlatform("darwin-x86_64", /^Prism\.app\.tar\.gz$/i);

          // Darwin aarch64
          registerPlatform("darwin-aarch64", /(aarch64|arm64).*app\.tar\.gz$/i);

          fs.writeFileSync(path.join(distDir, "latest.json"), JSON.stringify(manifest, null, 2));
          console.log("Generated latest.json:");
          console.log(JSON.stringify(manifest, null, 2));
          '

      - name: Generate Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=( * )
          if (( ${#files[@]} == 0 )); then
            echo "no release artifacts found in dist/" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.txt

      - name: Clean dev release
        if: env.channel == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev --yes --repo "${{ github.repository }}" || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: ${{ env.release_name }}
          prerelease: ${{ env.prerelease == 'true' }}
          files: |
            dist/*

  docker-backend-arch:
    name: docker backend (${{ matrix.arch }})
    needs: test-rust
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Requires a native ARM64 runner. If your repo doesn't have access to
          # GitHub-hosted ARM runners yet, switch this to self-hosted labels.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

      - name: Add arch suffix to tags
        id: archtags
        shell: bash
        run: |
          set -euo pipefail

          suffix="-${{ matrix.arch }}"
          out=""
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            out+="${tag}${suffix}"$'\n'
          done <<< "${{ steps.meta.outputs.tags }}"

          {
            echo 'tags<<EOF'
            echo "${out}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (single-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            RUST_MUSL_IMAGE=${{ matrix.arch == 'arm64' && 'aarch64-musl-stable' || 'x86_64-musl-stable' }}
            MUSL_TARGET=${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl' }}
          tags: ${{ steps.archtags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

  docker-backend:
    name: docker backend (multi-arch manifest)
    runs-on: ubuntu-latest
    needs: docker-backend-arch
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}

      - name: Create and push multi-arch manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"
