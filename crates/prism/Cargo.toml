[package]
name = "prism_native"
version = "0.1.0"
edition = "2024"

[lib]
name = "prism_native"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "prism"
path = "src/main.rs"

[build-dependencies]
uniffi = { version = "0.32", features = ["build", "bindgen"] }

[dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
anyhow = "1.0"
arc-swap = "1.9"
async-trait = "0.1"
axum = "0.8"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
dashmap = "6.2"
directories = "6.0"
futures-util = "0.3"
humantime = "2.4"
keyring = "3"
instant-acme = { version = "0.8.5", default-features = false, features = [
	"hyper-rustls",
	"ring",
	"x509-parser",
] }
mdns-sd = "0.21"
pin-project-lite = "0.2"
quinn = "0.11"
rand = "0.10"
rcgen = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1.13"
# Explicitly enable ring so the binary always has a usable rustls crypto backend.
# Quinn may also enable aws-lc-rs; main installs ring as the process default.
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2"
webpki-roots = "0.26"
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
url = "2.5"
reqwest = { version = "0.13.4", default-features = false, features = [
	"json",
	"rustls",
	"system-proxy",
	"socks",
] }
minisign-verify = "0.2"
self-replace = "1.5"
tokio = { version = "1.53", features = [
	"macros",
	"rt-multi-thread",
	"net",
	"io-util",
	"time",
	"signal",
	"sync",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio_kcp = "0.9"
toml = "1.1"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
wasmtime = "48"
tokio-yamux = "0.3"
rsa = "0.9"
aes = "0.9"
cfb-mode = "0.9"
miniz_oxide = { version = "0.9", features = ["simd"] }
lz4_flex = "0.14"
zstd = "0.14"
base64 = "0.23"
sha2 = "0.11"
subtle = "2.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
x509-parser = "0.18"
wtransport = { version = "0.7", features = ["self-signed", "dangerous-configuration"] }
hickory-resolver = { version = "0.26.2", default-features = false, features = [
	"system-config",
	"tokio",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

