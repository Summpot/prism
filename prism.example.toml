#:schema https://raw.githubusercontent.com/Summpot/prism/master/prism.schema.json
admin_addr = ":8080"
proxy_protocol_v2 = false
buffer_size = 32768
upstream_dial_timeout_ms = 5000
max_header_bytes = 65536

# role = "standalone" # standalone | management | worker

# Management-only bootstrap example. A management node can omit listeners/routes/tunnel
# entirely and just run the control plane + panel API.
# role = "management"
# [managed.management]
# state_file = "managed-state.json"
# panel_token = "panel-secret"
# worker_token = "worker-secret"

# Worker bootstrap example. Managed workers keep only bootstrap identity/agent
# settings locally; desired runtime config is synced from the management node.
# role = "worker"
# [managed.worker]
# node_id = "edge-1"
# management_url = "http://127.0.0.1:8080"
# auth_token = "worker-secret"
# connection_mode = "active" # active | passive
# sync_interval_ms = 5000
# agent_url = "http://10.0.0.12:8081"

# Public-facing proxy listeners (multi-port / multi-protocol).
#
# TCP listeners can run in hostname-routing mode (host extraction via wasm middlewares)
# or in fixed forwarding mode.
# UDP listeners run in fixed forwarding mode.

[[listeners]]
listen_addr = ":25565"
protocol = "tcp"

# If upstream is omitted for a TCP listener, Prism uses hostname routing.
# If upstream is set, Prism forwards to that fixed upstream.

# Example UDP game port forwarding (direct):
[[listeners]]
listen_addr = ":19132"
protocol = "udp"
upstream = "127.0.0.1:19132"

# Authentication & Access Control (OAuth + Token Management)
# [auth]
# # When enabled, users can sign in with GitHub via Web OAuth (Control Panel)
# # and Device Authorization Flow (Client sidecars).
# [auth.github]
# enabled = false
# client_id = "your-github-oauth-client-id"
# client_secret = "your-github-oauth-client-secret"
# redirect_uri = "http://127.0.0.1:8080/auth/github/callback"
# allowed_users = ["your-github-username"]
# allowed_orgs = []
# admin_users = ["your-github-username"]
# default_service_rules = ["*"]

[tunnel]
auth_token = ""

# When true, prisms will automatically open server-side listeners for tunnel
# services that specify remote_addr (frp-like behavior).
auto_listen_services = true

# Configure one or more tunnel endpoints. Multiple endpoints allow serving
# multiple transports at the same time (similar to frp's server).

[[tunnel.endpoints]]
listen_addr = ":7000"
transport = "tcp" # tcp | udp | quic | websocket (ws) | wss

[[tunnel.endpoints]]
listen_addr = ":7001"
transport = "quic"

[tunnel.endpoints.quic]
# If transport=quic and cert/key are empty, prism will generate a self-signed
# certificate at startup.
cert_file = ""
key_file = ""

# Example WebSocket tunnel endpoint (ws or wss):
# [[tunnel.endpoints]]
# listen_addr = ":7002"
# transport = "websocket" # or "wss"
# [tunnel.endpoints.websocket]
# cert_file = ""
# key_file = ""

# Optional: tunnel connector host role (uncomment to expose private services).
#
# [tunnel.connector]
# server_addr = "relay.example.com:7000"
# transport = "quic" # tcp | udp | quic | websocket | wss
# auth_token = "cluster-secret-token"
# dial_timeout_ms = 5000
#
# [tunnel.connector.quic]
# server_name = "relay.example.com"
# insecure_skip_verify = false
#
# [tunnel.connector.websocket]
# server_name = "relay.example.com"
# insecure_skip_verify = false
#
# [[tunnel.services]]
# name = "minecraft-survival"
# proto = "tcp" # tcp | udp
# local_addr = "127.0.0.1:25565"
# middleware = "minecraft" # standard Prism middleware name
# route_only = false # optional. If true, only reachable via routes (tunnel:minecraft-survival).
# remote_addr = ":25565" # optional (frp-like). If set, prism server auto-opens this listener.
# masquerade_host = "" # advanced. If set, rewrite middlewares use this host when routing.
# # Leave empty for normal Minecraft tunnel routing to preserve the client's handshake host.
# # Supports $1, $2... substitutions from route wildcard capture groups.
#
# [tunnel.services.optimizer]
# enabled = true
# flush_interval_ms = 20
# zstd_window_log = 23
# zstd_level = 3
#
# Optional: terminal client sidecar role (uncomment to enable client access).
#
# [tunnel.client]
# server_addr = "relay.example.com:7000"
# transport = "quic" # tcp | quic | kcp | websocket | wss
# auth_token = "cluster-secret-token"
# listen_addr = "127.0.0.1:25565"
# middleware = "minecraft"
#
# [tunnel.client.optimizer]
# enabled = true
# zstd_window_log = 23
#
# [tunnel.client.discovery.minecraft_lan]
# enabled = true
# motd_prefix = "[Prism] "

# mDNS local service discovery (tunnel client only).
# When enabled, Prism advertises tunnel services on the local network via mDNS
# so that other LAN devices can resolve <service>.<subdomain>.local to this machine
# and connect through the local proxy.
#
# [tunnel.mdns]
# enabled = false
# domain = "local"
# subdomain = "prism"         # services -> <name>.prism.local
# listen_addr = ":25565"      # local proxy bind address (0.0.0.0 for LAN access)
# middlewares = ["minecraft"]  # middleware for hostname extraction

[logging]
level = "info"
format = "json"
output = "stderr"
add_source = false

[reload]
enabled = true
poll_interval_ms = 1000

# Each route must specify one or more routing middlewares (by name).
# Middlewares are loaded from "<config_dir>/middlewares/<name>.wat" by default.
# Prism will also materialize a few default/reference middlewares into that directory on startup
# (only if the files do not already exist).

[timeouts]
handshake_timeout_ms = 3000
idle_timeout_ms = 0

[[routes]]
host = "play.example.com"
upstream = "127.0.0.1:25566"
middlewares = ["minecraft"]

# Wildcards ('*' and '?') support capture groups that can be substituted into upstreams
# using $1, $2, ...
[[routes]]
host = "*.labs.example.com"
upstreams = ["127.0.0.1:25567", "127.0.0.1:25568"]
strategy = "round-robin"
middlewares = ["minecraft"]

[[routes]]
host = "home.example.com"
upstream = "tunnel:home-mc"
middlewares = ["minecraft"]
